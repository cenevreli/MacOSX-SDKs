<!doctype html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DT LMS</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="app-header">
    <h1>DT LMS</h1>
    <p>Öğrenme paneli</p>
  </header>

  <main class="layout">
    <section class="panel">
      <h2>Kurslar</h2>
      <ul id="courseList" class="list"></ul>
    </section>

    <section class="panel">
      <h2 id="courseTitle">Kurs Seçin</h2>
      <div id="lessonList" class="list"></div>
    </section>

    <section class="panel">
      <h2>İlerleme</h2>
      <div class="progress-wrap">
        <div id="progressBar" class="progress-bar"></div>
      </div>
      <p id="progressText">%0 tamamlandı</p>
      <button id="resetBtn" class="btn">İlerlemeyi Sıfırla</button>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
